<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parent()</title>
</head>
<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="jquery.min.js"></script>

    <script>
        $(function($){
            $("span").parent().css({"color": "red", "border": "2px solid red"});
        });
    </script>

    <style>
        .ancestors * {
            display: block;
            border: 2px solid rgb(27, 175, 22);
            color: rgb(39, 180, 51);
            padding: 5px;
            margin: 15px;
        }
    </style>

    <div class="ancestors">
        <div style="width: 300px;">div (grandparent)
            <p>p (direct parent)
                <span>span</span>
            </p>
        </div>
    </div>

</body>
</html>
